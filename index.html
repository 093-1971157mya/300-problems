      updateTimer();
    }

    function tick() {
      seconds--;
      updateTimer();
      if (seconds <= 0) submitTest(true);
    }

    function updateTimer() {
      const h = String(Math.max(0, Math.floor(seconds / 3600))).padStart(2, "0");
      const m = String(Math.max(0, Math.floor((seconds % 3600) / 60))).padStart(2, "0");
      const s = String(Math.max(0, seconds % 60)).padStart(2, "0");
      document.getElementById("timer").textContent = `${h}:${m}:${s}`;
      document.getElementById("timer").classList.toggle("text-red-300", seconds < 300);
    }

    function renderQuestion() {
      const q = questions[current];
      document.getElementById("question-count").textContent = `Question ${current + 1} of ${questions.length}`;
      document.getElementById("question-text").textContent = q.question;
      document.getElementById("question-panel").classList.remove("fade-in");
      void document.getElementById("question-panel").offsetWidth;
      document.getElementById("question-panel").classList.add("fade-in");
      const form = document.getElementById("answer-form");
      form.innerHTML = "";
      q.options.forEach((option, index) => {
        const id = `option-${current}-${index}`;
        const label = document.createElement("label");
        label.className = `choice-option flex items-center gap-4 w-full cursor-pointer rounded-2xl border-2 p-4 sm:p-5 ${answers[q.id] === option ? "selected" : "border-slate-200 bg-white"}`;
        label.htmlFor = id;
        label.innerHTML = `<input id="${id}" name="question-${current}" type="radio" value="${option}" class="sr-only" ${answers[q.id] === option ? "checked" : ""}>
          <span class="w-8 h-8 shrink-0 rounded-full border-2 border-[#93a4b8] flex items-center justify-center font-bold text-sm text-[#334b67]">${String.fromCharCode(65 + index)}</span>
          <span class="text-base sm:text-lg font-medium text-[#10213d]">${option}</span>`;
        label.addEventListener("click", () => {
          answers[q.id] = option;
          renderQuestion();
          renderNavigator();
        });
        form.appendChild(label);
      });
      document.getElementById("prev-btn").disabled = current === 0;
      const next = document.getElementById("next-btn");
      next.querySelector("span").textContent = current === questions.length - 1 ? "Review answers" : "Next question";
      document.getElementById("answered-status").textContent = answers[q.id] ? "Answered" : "Not answered";
      document.getElementById("answered-status").className = answers[q.id] ? "rounded-full px-3 py-1.5 bg-[#dcebd8] text-xs font-bold text-[#185c33]" : "rounded-full px-3 py-1.5 bg-[#edf2f7] text-xs font-bold text-[#46617d]";
    }

    function renderNavigator() {
      const nav = document.getElementById("question-nav");
      nav.innerHTML = "";
      questions.forEach((q, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `nav-dot h-9 rounded-lg border text-xs font-bold ${index === current ? "current" : answers[q.id] ? "answered" : "bg-white border-slate-200 text-[#60708a] hover:border-[#60708a]"}`;
        button.textContent = index + 1;
        button.setAttribute("aria-label", `Go to question ${index + 1}`);
        button.addEventListener("click", () => { current = index; renderQuestion(); renderNavigator(); });
        nav.appendChild(button);
      });
      const total = Object.keys(answers).length;
      document.getElementById("progress-number").textContent = `${total} / ${questions.length}`;
      document.getElementById("progress-bar").style.width = `${total / questions.length * 100}%`;
    }

    function openSubmitModal() {
      document.getElementById("modal-copy").textContent = `You have answered ${Object.keys(answers).length} of ${questions.length} questions. Unanswered questions will be marked incorrect.`;
      document.getElementById("submit-modal").classList.remove("hidden");
    }

    function submitTest(timeUp = false) {
      if (submitted) return;
      submitted = true;
      clearInterval(timerId);
      document.getElementById("submit-modal").classList.add("hidden");
      document.getElementById("test-view").classList.add("hidden");
      document.getElementById("results-view").classList.remove("hidden");
      const correct = questions.filter(q => answers[q.id] === q.correct).length;
      const score = Math.round((correct / questions.length) * 100);
      document.getElementById("score-display").textContent = `${score}%`;
      document.getElementById("score-detail").textContent = `${correct} correct out of ${questions.length}${timeUp ? " · Time expired" : ""}`;
      document.getElementById("score-message").textContent = score >= 80 ? "Strong work. Review any missed skills, then try another randomized attempt." : score >= 60 ? "You are building a solid foundation. Use the explanations below to strengthen missed concepts." : "Keep practicing. Study the explanations below and focus on one topic at a time before your next attempt.";
      renderReview();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderReview() {
      const list = document.getElementById("review-list");
      list.innerHTML = "";
      questions.forEach((q, index) => {
        const isCorrect = answers[q.id] === q.correct;
        const card = document.createElement("article");
        card.className = `rounded-2xl border p-5 sm:p-6 ${isCorrect ? "border-[#b9dabe] bg-[#f3fbf3]" : "border-[#f0c2bd] bg-[#fff8f6]"}`;
        card.innerHTML = `
          <div class="flex items-start gap-3">
            <div class="mt-0.5 w-8 h-8 shrink-0 rounded-full flex items-center justify-center font-bold ${isCorrect ? "bg-[#dcebd8] text-[#185c33]" : "bg-[#f9ddd8] text-[#a53325]"}">${isCorrect ? "✓" : "×"}</div>
            <div class="min-w-0">
              <p class="text-xs uppercase tracking-widest font-bold ${isCorrect ? "text-[#327545]" : "text-[#b74739]"}">Question ${index + 1} · ${isCorrect ? "Correct" : "Review"}</p>
              <h3 class="mt-2 text-lg font-bold text-[#10213d]">${q.question}</h3>
              <div class="mt-4 grid sm:grid-cols-2 gap-3 text-sm">
                <p class="rounded-xl bg-white/80 p-3 text-[#52657d]"><strong class="text-[#10213d]">Your answer:</strong> ${answers[q.id] || "No answer selected"}</p>
                <p class="rounded-xl bg-white/80 p-3 text-[#52657d]"><strong class="text-[#10213d]">Correct answer:</strong> ${q.correct}</p>
              </div>
              <p class="mt-4 text-sm leading-6 text-[#40556e]"><strong class="text-[#10213d]">Explanation:</strong> ${q.explanation}</p>
            </div>
          </div>`;
        list.appendChild(card);
      });
    }

    document.getElementById("prev-btn").addEventListener("click", () => {
      if (current > 0) { current--; renderQuestion(); renderNavigator(); }
    });
    document.getElementById("next-btn").addEventListener("click", () => {
      if (current < questions.length - 1) { current++; renderQuestion(); renderNavigator(); }
      else openSubmitModal();
    });
    document.getElementById("submit-btn").addEventListener("click", openSubmitModal);
    document.getElementById("cancel-submit").addEventListener("click", () => document.getElementById("submit-modal").classList.add("hidden"));
    document.getElementById("confirm-submit").addEventListener("click", () => submitTest(false));
    document.getElementById("restart-btn").addEventListener("click", startTest);
    document.getElementById("fullscreen-btn").addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {}
    });

    ["copy", "cut", "contextmenu", "dragstart"].forEach(eventName => document.addEventListener(eventName, e => e.preventDefault()));
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && ["c", "x", "p", "s", "u"].includes(e.key.toLowerCase())) e.preventDefault();
      if (e.key === "PrintScreen") e.preventDefault();
    });

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      startTest();
    });
  </script>
 </body>
</html>
