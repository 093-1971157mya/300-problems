      ["Solve: 5x − 12 = 3x + 8",["−10","2","10","20"],"10","2x − 12 = 8, so 2x = 20 and x = 10."],
      ["What is 0.6 written as a percent?",["0.6%","6%","60%","600%"],"60%","Multiply the decimal by 100."],
      ["The ratio of boys to girls is 3:5. If there are 24 boys, how many girls are there?",["15","30","40","72"],"40","3 parts = 24, so 1 part = 8. Girls = 5 × 8."],
      ["Which expression represents seven less than twice a number n?",["2n + 7","2n − 7","7 − 2n","n/2 − 7"],"2n − 7","Twice a number is 2n; seven less means subtract 7."],
      ["What is the area of a circle with radius 4? Use π ≈ 3.14.",["12.56","25.12","50.24","100.48"],"50.24","Area = πr² = 3.14 × 16 = 50.24."],
      ["A worker earns $18 per hour for 35 hours. What are the weekly earnings?",["$530","$630","$700","$1,530"],"$630","18 × 35 = 630."],
      ["What is the value of |−13|?",["−13","0","13","26"],"13","Absolute value is distance from zero."],
      ["A population of 500 increases by 10%. What is the new population?",["450","505","510","550"],"550","10% of 500 is 50. Add: 500 + 50 = 550."],
      ["Solve the inequality: 2x + 5 > 17",["x > 6","x < 6","x > 11","x < 11"],"x > 6","Subtract 5, then divide by 2."],
      ["What is the simple interest on $1,000 at 5% for 2 years?",["$50","$100","$500","$1,100"],"$100","Interest = principal × rate × time = 1000 × .05 × 2."],
      ["Which ordered pair is on the y-axis?",["(0, 5)","(5, 0)","(2, 2)","(−3, 4)"],"(0, 5)","Points on the y-axis have x-coordinate 0."],
      ["A box is 2.5 m long, 1.2 m wide, and 2 m high. What is its volume?",["5 m³","6 m³","11.4 m³","12 m³"],"6 m³","2.5 × 1.2 × 2 = 6 m³."],
      ["What is 7/8 ÷ 1/4?",["7/32","7/8","1 3/4","3 1/2"],"3 1/2","Multiply by the reciprocal: 7/8 × 4 = 28/8 = 3 1/2."],
      ["If 4 notebooks cost $10, how much do 10 notebooks cost?",["$20","$25","$40","$100"],"$25","One notebook costs $2.50. Ten cost $25."],
      ["What is 30% of 90?",["18","27","30","60"],"27","0.30 × 90 = 27."],
      ["Find x: 9 + x = 4x − 6",["3","5","6","15"],"5","15 + x = 4x, so 15 = 3x and x = 5."],
      ["Which is greatest?",["0.49","1/2","48%","0.45"],"1/2","1/2 = 0.50, greater than the other values."],
      ["A 15-foot ladder is placed 9 feet from a wall. How high does it reach?",["6 ft","9 ft","12 ft","24 ft"],"12 ft","height² = 15² − 9² = 144, so height = 12."],
      ["What is the range of 2, 5, 5, 8, 11?",["5","6","9","11"],"9","Range = greatest − least = 11 − 2."],
      ["A $120 bill is split equally among 8 people. How much does each pay?",["$12","$15","$18","$112"],"$15","120 ÷ 8 = 15."],
      ["Simplify: 6a + 2b − 3a + 5b",["3a + 7b","3a − 3b","9a + 7b","9a − 3b"],"3a + 7b","Combine like terms."],
      ["A 20-ounce drink is shared equally by 5 people. How many ounces each?",["2 oz","4 oz","5 oz","15 oz"],"4 oz","20 ÷ 5 = 4."],
      ["What is the y-intercept of y = −2x + 7?",["−2","0","2","7"],"7","In y = mx + b, b is the y-intercept."],
      ["A store gives a 25% discount on a $64 item. What is the discount amount?",["$12","$16","$20","$48"],"$16","25% is one fourth. One fourth of $64 is $16."],
      ["What is 2³ × 2⁴?",["2⁷","2¹²","4⁷","4¹²"],"2⁷","When multiplying same bases, add exponents."],
      ["A map scale says 1 inch = 20 miles. Towns are 3.5 inches apart. How far?",["23.5 miles","60 miles","70 miles","700 miles"],"70 miles","3.5 × 20 = 70."],
      ["What is the value of 18 − 3(4 + 2)?",["0","6","12","90"],"0","4 + 2 = 6, then 18 − 3(6) = 0."],
      ["A cylinder has radius 3 and height 10. What is its volume using π ≈ 3.14?",["94.2","282.6","565.2","942"],"282.6","πr²h = 3.14 × 3² × 10 = 282.6."],
      ["If 6 pens cost $4.50, what is the cost of one pen?",["$0.50","$0.75","$1.33","$2.25"],"$0.75","4.50 ÷ 6 = 0.75."],
      ["A score rises from 70 to 84. What is the percent increase?",["14%","20%","70%","84%"],"20%","Increase is 14. 14 ÷ 70 = .20 = 20%."],
      ["Solve: 4(x + 2) = 36",["7","8","9","11"],"7","x + 2 = 9, so x = 7."],
      ["What is the mode of 3, 6, 6, 7, 9, 9, 9, 10?",["6","7","9","10"],"9","9 occurs most often."],
      ["A plane ticket costs $250 plus a baggage fee of $35. What is the total?",["$215","$250","$285","$8,750"],"$285","250 + 35 = 285."]
    ];

    const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
    let questions = [], answers = {}, current = 0, seconds = 5400, timerId = null, submitted = false;

    function updateTimer() {
      const h = String(Math.max(0, Math.floor(seconds / 3600))).padStart(2, "0");
      const m = String(Math.max(0, Math.floor((seconds % 3600) / 60))).padStart(2, "0");
      const s = String(Math.max(0, seconds % 60)).padStart(2, "0");
      const timer = document.getElementById("timer");
      timer.textContent = `${h}:${m}:${s}`;
      timer.classList.toggle("text-red-300", seconds < 300);
    }

    function tick() {
      seconds--;
      updateTimer();
      if (seconds <= 0) submitTest(true);
    }

    function startTest() {
      questions = shuffle(bank).slice(0, 60).map((q, i) => ({ id:i, question:q[0], options:shuffle(q[1]), correct:q[2], explanation:q[3] }));
      answers = {};
      current = 0;
      seconds = 5400;
      submitted = false;
      document.getElementById("cover-view").classList.add("hidden");
      document.getElementById("assessment-view").classList.remove("hidden");
      document.getElementById("results-view").classList.add("hidden");
      document.getElementById("test-view").classList.remove("hidden");
      clearInterval(timerId);
      timerId = setInterval(tick, 1000);
      updateTimer();
      renderQuestion();
      renderNavigator();
      window.scrollTo({ top:0, behavior:"smooth" });
    }

    function renderQuestion() {
      const q = questions[current];
      document.getElementById("question-count").textContent = `Question ${current + 1} of ${questions.length}`;
      document.getElementById("question-text").textContent = q.question;
      const panel = document.getElementById("question-panel");
      panel.classList.remove("fade-in");
      void panel.offsetWidth;
      panel.classList.add("fade-in");

      const form = document.getElementById("answer-form");
      form.replaceChildren();
      q.options.forEach((option, index) => {
        const id = `option-${current}-${index}`;
        const label = document.createElement("label");
        label.className = `choice-option flex w-full cursor-pointer items-center gap-4 rounded-2xl border-2 p-4 sm:p-5 ${answers[q.id] === option ? "selected" : "border-slate-200 bg-white"}`;
        label.htmlFor = id;
        const input = document.createElement("input");
        input.id = id;
        input.name = `question-${current}`;
        input.type = "radio";
        input.value = option;
        input.checked = answers[q.id] === option;
        input.className = "sr-only";
        const letter = document.createElement("span");
        letter.className = "flex h-8 w-8 shrink-0 items-center justify-center rounded-full border-2 border-[#93a4b8] text-sm font-bold text-[#334b67]";
        letter.textContent = String.fromCharCode(65 + index);
        const text = document.createElement("span");
        text.className = "text-base font-medium text-[#10213d] sm:text-lg";
        text.textContent = option;
        label.append(input, letter, text);
        label.addEventListener("click", () => {
          answers[q.id] = option;
          renderQuestion();
          renderNavigator();
        });
        form.appendChild(label);
      });

      document.getElementById("prev-btn").disabled = current === 0;
      document.querySelector("#next-btn span").textContent = current === questions.length - 1 ? "Review answers" : "Next question";
      const status = document.getElementById("answered-status");
      status.textContent = answers[q.id] ? "Answered" : "Not answered";
      status.className = answers[q.id] ? "rounded-full px-3 py-1.5 bg-[#dcebd8] text-xs font-bold text-[#185c33]" : "rounded-full px-3 py-1.5 bg-[#edf2f7] text-xs font-bold text-[#46617d]";
    }

    function renderNavigator() {
      const nav = document.getElementById("question-nav");
      nav.replaceChildren();
      questions.forEach((q, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `nav-dot h-9 rounded-lg border text-xs font-bold ${index === current ? "current" : answers[q.id] ? "answered" : "bg-white border-slate-200 text-[#60708a] hover:border-[#60708a]"}`;
        button.textContent = index + 1;
        button.setAttribute("aria-label", `Go to question ${index + 1}`);
        button.addEventListener("click", () => { current = index; renderQuestion(); renderNavigator(); });
        nav.appendChild(button);
      });
      const total = Object.keys(answers).length;
      document.getElementById("progress-number").textContent = `${total} / ${questions.length}`;
      document.getElementById("progress-bar").style.width = `${total / questions.length * 100}%`;
    }

    function openSubmitModal() {
      document.getElementById("modal-copy").textContent = `You have answered ${Object.keys(answers).length} of ${questions.length} questions. Unanswered questions will be marked incorrect.`;
      document.getElementById("submit-modal").classList.remove("hidden");
      document.getElementById("submit-modal").classList.add("flex");
    }

    function submitTest(timeUp) {
      if (submitted) return;
      submitted = true;
      clearInterval(timerId);
      document.getElementById("submit-modal").classList.add("hidden");
      document.getElementById("submit-modal").classList.remove("flex");
      document.getElementById("test-view").classList.add("hidden");
      document.getElementById("results-view").classList.remove("hidden");
      const correct = questions.filter(q => answers[q.id] === q.correct).length;
      const score = Math.round(correct / questions.length * 100);
      document.getElementById("score-display").textContent = `${score}%`;
      document.getElementById("score-detail").textContent = `${correct} correct out of ${questions.length}${timeUp ? " · Time expired" : ""}`;
      document.getElementById("score-message").textContent = score >= 80 ? "Strong work. Review any missed skills, then try another randomized attempt." : score >= 60 ? "You are building a solid foundation. Use the explanations below to strengthen missed concepts." : "Keep practicing. Study the explanations below and focus on one topic at a time before your next attempt.";
      renderReview();
      window.scrollTo({ top:0, behavior:"smooth" });
    }

    function renderReview() {
      const list = document.getElementById("review-list");
      list.replaceChildren();
      questions.forEach((q, index) => {
        const isCorrect = answers[q.id] === q.correct;
        const card = document.createElement("article");
        card.className = `rounded-2xl border p-5 sm:p-6 ${isCorrect ? "border-[#b9dabe] bg-[#f3fbf3]" : "border-[#f0c2bd] bg-[#fff8f6]"}`;
        const title = document.createElement("p");
        title.className = `text-xs uppercase tracking-widest font-bold ${isCorrect ? "text-[#327545]" : "text-[#b74739]"}`;
        title.textContent = `Question ${index + 1} · ${isCorrect ? "Correct" : "Review"}`;
        const question = document.createElement("h3");
        question.className = "mt-2 text-lg font-bold text-[#10213d]";
        question.textContent = q.question;
        const answersGrid = document.createElement("div");
        answersGrid.className = "mt-4 grid gap-3 text-sm sm:grid-cols-2";
        const your = document.createElement("p");
        your.className = "rounded-xl bg-white/80 p-3 text-[#52657d]";
        your.innerHTML = "<strong class='text-[#10213d]'>Your answer:</strong> ";
        your.append(document.createTextNode(answers[q.id] || "No answer selected"));
        const correct = document.createElement("p");
        correct.className = "rounded-xl bg-white/80 p-3 text-[#52657d]";
        correct.innerHTML = "<strong class='text-[#10213d]'>Correct answer:</strong> ";
        correct.append(document.createTextNode(q.correct));
        answersGrid.append(your, correct);
        const explanation = document.createElement("p");
        explanation.className = "mt-4 text-sm leading-6 text-[#40556e]";
        explanation.innerHTML = "<strong class='text-[#10213d]'>Explanation:</strong> ";
        explanation.append(document.createTextNode(q.explanation));
        card.append(title, question, answersGrid, explanation);
        list.appendChild(card);
      });
    }

    document.getElementById("start-btn").addEventListener("click", startTest);
    document.getElementById("prev-btn").addEventListener("click", () => {
      if (current > 0) { current--; renderQuestion(); renderNavigator(); }
    });
    document.getElementById("next-btn").addEventListener("click", () => {
      if (current < questions.length - 1) { current++; renderQuestion(); renderNavigator(); }
      else openSubmitModal();
    });
    document.getElementById("submit-btn").addEventListener("click", openSubmitModal);
    document.getElementById("cancel-submit").addEventListener("click", () => {
      document.getElementById("submit-modal").classList.add("hidden");
      document.getElementById("submit-modal").classList.remove("flex");
    });
    document.getElementById("confirm-submit").addEventListener("click", () => submitTest(false));
    document.getElementById("restart-btn").addEventListener("click", startTest);
    document.getElementById("fullscreen-btn").addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {}
    });

    document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
  </script>
